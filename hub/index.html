<style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .bento-card {
            background-color: #ffffff;
            border: 1px solid #E2E8F0;
            border-radius: 0.5rem;
            padding: 24px;
            transition: border-color 0.2s ease;
        }
        .bento-card:hover {
            border-color: #775a00;
        }
        .input-field {
            width: 100%;
            background-color: #ffffff;
            border: 1px solid #E2E8F0;
            border-radius: 0.125rem;
            padding: 8px 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            color: #0b1c30;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .input-field:focus {
            border-color: #1d4ed8;
            box-shadow: 0 0 0 2px rgba(29, 78, 216, 0.2);
        }
        .btn-primary {
            background-color: #e6b325;
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 0.125rem;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 14px;
            transition: background-color 0.2s ease;
        }
        .btn-primary:hover {
            background-color: #f3bf32;
        }
        .btn-secondary {
            background-color: transparent;
            color: #0b1c30;
            border: 1px solid #E2E8F0;
            padding: 8px 16px;
            border-radius: 0.125rem;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 14px;
            transition: border-color 0.2s ease, color 0.2s ease;
        }
        .btn-secondary:hover {
            border-color: #1d4ed8;
            color: #1d4ed8;
        }
        .log-area {
            background-color: #1E293B;
            color: #E2E8F0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            padding: 16px;
            border-radius: 0.25rem;
            height: 300px;
            overflow-y: auto;
        }
        .log-entry { margin-bottom: 4px; }
        .log-time { color: #8fcdff; margin-right: 8px; }
        .log-info { color: #cbe6ff; }
        .log-warn { color: #f3bf32; }
        .log-error { color: #ffdad6; }
    </style>
</head>

</div>

<div class="flex items-center gap-md">
<button class="text-on-surface-variant hover:text-primary transition-colors" id="btn-headless">
<span class="material-symbols-outlined">visibility</span>
</button>
<div class="bg-surface-container-high px-sm py-xs rounded-full flex items-center gap-xs text-label-sm font-label-sm" id="conn-badge">
<div id="conn-dot" class="w-2 h-2 rounded-full bg-primary-container"></div>
                <span id="conn-text">Connected</span>
            </div>
<div class="text-label-sm font-label-sm text-on-surface-variant" id="sb-uptime">
                Up: 14d 2h 45m
            </div>

</div>
</header>
<!-- Main Content Grid -->
<main class="flex-1 p-lg container mx-auto max-w-7xl">
<div class="grid grid-cols-1 md:grid-cols-12 gap-gutter">
<!-- Launch Workers Section -->
<div class="md:col-span-4 bento-card flex flex-col gap-md">
<h2 class="font-headline-md text-headline-md text-on-surface flex items-center gap-sm cursor-pointer help-trigger hover:opacity-80 transition-opacity select-none" data-help="workers">
<span class="material-symbols-outlined text-primary">rocket_launch</span>
                    Launch Workers
<span class="material-symbols-outlined text-on-surface-variant text-[18px]">help</span>
                </h2>
<div class="flex flex-col gap-sm">
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs" for="cfg-grok">Grok Instances</label>
<input class="input-field" id="cfg-grok" min="0" type="number" value="3"/>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs" for="cfg-gemini">Gemini Instances</label>
<input class="input-field" id="cfg-gemini" min="0" type="number" value="1"/>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs" for="cfg-chatgpt">ChatGPT Instances</label>
<input class="input-field" id="cfg-chatgpt" min="0" type="number" value="2"/>
</div>
</div>
<button class="btn-primary mt-auto w-full" id="btn-launch">Launch Fleet</button>
</div>
<!-- Worker Slots Section -->
<div class="md:col-span-8 bento-card flex flex-col gap-md">
<div class="flex justify-between items-center mb-sm">
<h2 class="font-headline-md text-headline-md text-on-surface flex items-center gap-sm cursor-pointer help-trigger hover:opacity-80 transition-opacity select-none" data-help="slots">
<span class="material-symbols-outlined text-primary">memory</span>
                        Worker Slots
<span class="material-symbols-outlined text-on-surface-variant text-[18px]">help</span>
                    </h2>
<div class="flex gap-md font-label-sm text-label-sm bg-surface-container py-xs px-sm rounded">
<span class="text-on-surface-variant">Total: <span class="font-bold text-on-surface" id="sb-slots">—</span></span>
<span class="text-on-surface-variant">Active: <span class="font-bold text-primary" id="sb-active">—</span></span>
</div>
</div>
<div class="grid grid-cols-2 md:grid-cols-4 gap-md flex-1" id="slots-row">
<!-- dynamic content generated by hub.js -->
</div>
</div>
<!-- Default URLs Section -->
<div class="md:col-span-6 bento-card flex flex-col gap-md">
<h2 class="font-headline-md text-headline-md text-on-surface flex items-center gap-sm cursor-pointer help-trigger hover:opacity-80 transition-opacity select-none" data-help="default_urls">
<span class="material-symbols-outlined text-primary">link</span>
                    Default URLs
<span class="material-symbols-outlined text-on-surface-variant text-[18px]">help</span>
                </h2>
<div class="flex flex-col gap-sm">
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs" for="url-grok">Grok Endpoint</label>
<input class="input-field" id="url-grok" type="text" value="https://grok.com"/>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs" for="url-gemini">Gemini Endpoint</label>
<input class="input-field" id="url-gemini" type="text" value="https://gemini.google.com/app"/>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs" for="url-chatgpt">ChatGPT Endpoint</label>
<input class="input-field" id="url-chatgpt" type="text" value="https://chatgpt.com"/>
</div>
</div>
<button class="btn-secondary mt-auto self-start" id="btn-save-urls">Save Defaults</button>
</div>
<!-- URL Management Section -->
<div class="md:col-span-6 bento-card flex flex-col gap-md">
<h2 class="font-headline-md text-headline-md text-on-surface flex items-center gap-sm cursor-pointer help-trigger hover:opacity-80 transition-opacity select-none" data-help="url_mgmt">
<span class="material-symbols-outlined text-primary">settings_applications</span>
                    URL Management
<span class="material-symbols-outlined text-on-surface-variant text-[18px]">help</span>
                </h2>
<div class="grid grid-cols-2 gap-sm">
<div class="col-span-2">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs" for="mgmt-key">Module Key</label>
<input class="input-field" id="mgmt-key" placeholder="e.g. OCtest" type="text"/>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs" for="mgmt-mode">Mode</label>
<select class="input-field bg-white" id="mgmt-mode">
<option value="fixed">Fixed</option>
<option value="time_based">Time-based</option>
<option value="usage_based" selected>Usage-based</option>
</select>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs" for="mgmt-ttl">TTL (m)</label>
<input class="input-field" id="mgmt-ttl" type="number" value="30"/>
</div>
<div class="col-span-2">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs" for="mgmt-uses">Max Uses (0 = unlimited)</label>
<input class="input-field" id="mgmt-uses" type="number" value="10"/>
</div>
</div>
<div class="flex gap-sm mt-auto">
<button class="btn-primary flex-1" id="btn-save-url-config">Save Config</button>
<button class="btn-secondary border-error text-error hover:bg-error-container hover:text-on-error-container hover:border-error-container" id="btn-force-delete">Force Delete</button>
</div>
</div>
<!-- System Logs & Data Management Section -->
<div class="md:col-span-12 bento-card flex flex-col gap-md">
<div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-md mb-sm">
<h2 class="font-headline-md text-headline-md text-on-surface flex items-center gap-sm cursor-pointer help-trigger hover:opacity-80 transition-opacity select-none" data-help="logs">
<span class="material-symbols-outlined text-primary">terminal</span>
                        System Logs &amp; Data
<span class="material-symbols-outlined text-on-surface-variant text-[18px]">help</span>
                    </h2>
<div class="flex flex-wrap items-center gap-sm w-full md:w-auto">
<select class="input-field w-auto min-w-[150px]" id="log-caller">
<option value="all">All Callers</option>
<option value="OC">OC</option>
<option value="CD">CD</option>
</select>
<button class="btn-secondary" id="btn-add-caller"><span class="material-symbols-outlined text-[18px] align-middle mr-xs">add</span>Add Caller</button>
<button class="btn-secondary" id="btn-export-logs"><span class="material-symbols-outlined text-[18px] align-middle mr-xs">download</span>Export</button>
<button class="btn-secondary border-error text-error" id="btn-clear-all-logs"><span class="material-symbols-outlined text-[18px] align-middle mr-xs">delete</span>Clear</button>
</div>
</div>
<!-- Hidden Add Caller Box -->
<div class="hidden bg-surface-container p-md rounded border border-outline-variant mb-md flex items-end gap-sm" id="add-caller-box">
<div class="flex-1">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs" for="new-caller-input">New Caller ID</label>
<input class="input-field" id="new-caller-input" placeholder="Enter Caller ID" type="text"/>
</div>
<button class="btn-primary" id="btn-save-new-caller">Save</button>
<button class="btn-secondary" id="btn-cancel-caller">Cancel</button>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md h-[400px]">
<!-- Logs -->
<div class="log-area h-full flex flex-col" id="system-log">
</div>
<!-- JSON Viewer -->
<div class="flex flex-col h-full border border-outline-variant rounded bg-surface-container-lowest">
<div class="flex justify-between items-center p-sm border-b border-outline-variant bg-surface-container-low">
